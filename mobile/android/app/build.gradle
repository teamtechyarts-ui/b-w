apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"
if (file("google-services.json").isFile()) {
    apply plugin: "com.google.gms.google-services"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")

if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def envMap = project.hasProperty("env") ? project.env : (project.ext.has("env") ? project.ext.env : [:])

def getSetting = { String key ->
    providers.gradleProperty(key).orNull ?: System.getenv(key) ?: envMap[key]
}

def resolveKeystoreFile = { String path ->
    if (!path?.trim()) return null
    def directFile = file(path)
    if (directFile.isFile()) return directFile
    def rootFile = rootProject.file(path)
    if (rootFile.isFile()) return rootFile
    def strippedPath = path.replaceFirst('^app[\\\\/]', '')
    def strippedFile = file(strippedPath)
    if (strippedFile.isFile()) return strippedFile
    return directFile
}

def googleMapsAndroidApiKey =
    localProperties.getProperty("GOOGLE_MAPS_ANDROID_API_KEY", "")
def releaseChannel = getSetting("BW_RELEASE_CHANNEL") ?: "production"
def releaseMapsKeyName = releaseChannel == "uat" ? "BW_UAT_GOOGLE_MAPS_ANDROID_API_KEY" : "BW_RELEASE_GOOGLE_MAPS_ANDROID_API_KEY"
def releaseMapsKey = getSetting(releaseMapsKeyName)
def releaseStoreFileRaw = getSetting("BW_RELEASE_STORE_FILE")
def releaseStoreFileObj = resolveKeystoreFile(releaseStoreFileRaw)
def releaseStoreFile = releaseStoreFileObj?.path
def releaseStorePassword = getSetting("BW_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = getSetting("BW_RELEASE_KEY_ALIAS")
def releaseKeyPassword = getSetting("BW_RELEASE_KEY_PASSWORD")
def releaseSigningReady = [releaseStoreFileRaw, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it?.trim() } && releaseStoreFileObj?.isFile()
def firebaseMarker = rootProject.file("../config/firebase/.staged-environment")
def stagedFirebaseEnvironment = firebaseMarker.isFile() ? firebaseMarker.text.trim() : ""

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.brightwhitemobile"
    defaultConfig {
        applicationId "com.brightwhitemobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        resValue "string", "build_config_package", "com.brightwhitemobile"

        manifestPlaceholders = [
            GOOGLE_MAPS_ANDROID_API_KEY: googleMapsAndroidApiKey
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            if (releaseChannel == "uat") applicationIdSuffix ".uat"
            manifestPlaceholders = [GOOGLE_MAPS_ANDROID_API_KEY: releaseMapsKey ?: ""]
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ["assembleDebug", "installDebug", "packageDebug"] && stagedFirebaseEnvironment && stagedFirebaseEnvironment != "development") {
        task.doFirst { throw new GradleException("Debug build cannot use non-Development Firebase configuration") }
    }
    if (task.name in ["assembleRelease", "bundleRelease", "packageRelease", "validateSigningRelease"]) {
        task.doFirst {
            if (!(releaseChannel in ["production", "uat"])) {
                throw new GradleException("Unknown release channel")
            }
            if (stagedFirebaseEnvironment && stagedFirebaseEnvironment != releaseChannel) {
                throw new GradleException("Release requires matching staged Firebase configuration")
            }
            if (file("google-services.json").isFile() && stagedFirebaseEnvironment != releaseChannel) {
                throw new GradleException("Release requires matching staged Firebase configuration")
            }
            if (!releaseSigningReady || !file(releaseStoreFile).isFile()) {
                throw new GradleException("Release signing requires a private keystore and all BW_RELEASE_* settings")
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
